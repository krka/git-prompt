name: Upstream Tracking Tests
tests:
- description: Branch in sync with upstream
  name: In sync with upstream
  group: upstream
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "content" > file.txt
  - git add file.txt
  - git commit -m "Initial"
  - git remote add origin https://example.com/repo.git
  - git config branch.master.remote origin
  - git config branch.master.merge refs/heads/master
  - git update-ref refs/remotes/origin/master HEAD
  expected: '{GREEN}[master]{}'
  expected_large: '{GRAY}[master]{}'
- description: Branch ahead of upstream
  name: Ahead of upstream (need to push)
  group: upstream
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "v1" > file.txt
  - git add file.txt
  - git commit -m "Version 1"
  - git remote add origin https://example.com/repo.git
  - git config branch.master.remote origin
  - git config branch.master.merge refs/heads/master
  - git update-ref refs/remotes/origin/master HEAD
  - echo "v2" > file.txt
  - git add file.txt
  - git commit -m "Version 2"
  expected: '{GREEN}[master]{} {BLUE}(↑1){}'
  expected_large: '{GRAY}[master]{} {BLUE}(↑1){}'
- description: Branch behind upstream
  name: Behind upstream (need to pull)
  group: upstream
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "v1" > file.txt
  - git add file.txt
  - git commit -m "Version 1"
  - echo "v2" > file.txt
  - git add file.txt
  - git commit -m "Version 2"
  - git remote add origin https://example.com/repo.git
  - git config branch.master.remote origin
  - git config branch.master.merge refs/heads/master
  - git update-ref refs/remotes/origin/master HEAD
  - git reset --hard HEAD~1
  expected: '{GREEN}[master]{} {YELLOW}(↓3s){}'
  expected_large: '{GRAY}[master]{} {YELLOW}(↓3s){}'
- description: Master tracking origin/master
  name: Master tracking origin/master (no duplicate indicators)
  group: upstream
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "v1" > file.txt
  - git add file.txt
  - git commit -m "Version 1"
  - echo "v2" > file.txt
  - git add file.txt
  - git commit -m "Version 2"
  - git remote add origin https://example.com/repo.git
  - git config branch.master.remote origin
  - git config branch.master.merge refs/heads/master
  - git update-ref refs/remotes/origin/master HEAD
  - git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/master
  - git reset --hard HEAD~1
  expected: '{GREEN}[master]{} {YELLOW}↓3s{}'
  expected_large: '{GRAY}[master]{} {YELLOW}↓3s{}'
- description: Branch diverged from upstream
  name: Diverged from upstream
  group: upstream
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base commit"
  - git remote add origin https://example.com/repo.git
  - git config branch.master.remote origin
  - git config branch.master.merge refs/heads/master
  - git update-ref refs/remotes/origin/master HEAD
  - git checkout -b temp
  - echo "remote change" > file.txt
  - git add file.txt
  - git commit -m "Remote change"
  - git update-ref refs/remotes/origin/master HEAD
  - git checkout master
  - echo "local change" > file2.txt
  - git add file2.txt
  - git commit -m "Local change"
  expected: '{GREEN}[master]{} {RED}(↑1 ↓8s){}'
  expected_large: '{GRAY}[master]{} {RED}(↑1 ↓8s){}'
- description: Feature branch ahead of origin/main
  name: Feature branch ahead of origin/main
  group: upstream
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "main" > file.txt
  - git add file.txt
  - git commit -m "Main commit"
  - git remote add origin https://example.com/repo.git
  - git update-ref refs/remotes/origin/main HEAD
  - git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main
  - git checkout -b feature
  - echo "feature1" > feature.txt
  - git add feature.txt
  - git commit -m "Feature commit 1"
  - echo "feature2" > feature2.txt
  - git add feature2.txt
  - git commit -m "Feature commit 2"
  expected: '{GREEN}[feature]{} {BLUE}↑2{}'
  expected_large: '{GRAY}[feature]{} {BLUE}↑2{}'
- description: Feature branch ahead of origin/master without origin/HEAD
  name: Feature branch ahead of origin/master (no origin/HEAD symref)
  group: upstream
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base commit"
  - git remote add origin https://example.com/repo.git
  - git update-ref refs/remotes/origin/master HEAD
  - git checkout -b feature
  - echo "feature1" > feature.txt
  - git add feature.txt
  - git commit -m "Feature commit 1"
  - echo "feature2" > feature2.txt
  - git add feature2.txt
  - git commit -m "Feature commit 2"
  - echo "feature3" > feature3.txt
  - git add feature3.txt
  - git commit -m "Feature commit 3"
  expected: '{GREEN}[feature]{} {BLUE}↑3{}'
  expected_large: '{GRAY}[feature]{} {BLUE}↑3{}'
- description: Feature branch behind origin/main
  name: Feature branch behind origin/main
  group: upstream
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "v1" > file.txt
  - git add file.txt
  - git commit -m "Version 1"
  - git checkout -b feature
  - echo "feature" > feature.txt
  - git add feature.txt
  - git commit -m "Feature commit"
  - git checkout -b main
  - echo "v2" > file.txt
  - git add file.txt
  - git commit -m "Version 2"
  - echo "v3" > file.txt
  - git add file.txt
  - git commit -m "Version 3"
  - git remote add origin https://example.com/repo.git
  - git update-ref refs/remotes/origin/main HEAD
  - git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main
  - git checkout feature
  expected: '{GREEN}[feature]{} {YELLOW}↓7s{}'
  expected_large: '{GRAY}[feature]{} {YELLOW}↓7s{}'
- description: Branch too far diverged from upstream
  name: Too far diverged from upstream
  group: upstream
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base"
  - git remote add origin https://example.com/repo.git
  - git config branch.master.remote origin
  - git config branch.master.merge refs/heads/master
  - git update-ref refs/remotes/origin/master HEAD
  - git checkout -b temp
  - command: echo x >> file.txt && git add file.txt && git commit -m 'Remote commit'
    repeat: 15
  - git update-ref refs/remotes/origin/master HEAD
  - git checkout master
  - command: echo y >> file2.txt && git add file2.txt && git commit -m 'Local commit'
    repeat: 15
  expected: '{GREEN}[master]{} {RED}(↑? ↓20s){}'
  expected_large: '{GRAY}[master]{} {RED}(↑? ↓20s){}'
- description: Branch far behind origin/main
  name: Far behind origin/main (>10 commits)
  group: upstream
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base"
  - git checkout -b feature
  - echo "feature" > feature.txt
  - git add feature.txt
  - git commit -m "Feature"
  - git checkout -b main
  - command: echo x >> file.txt && git add file.txt && git commit -m 'Main commit'
    repeat: 15
  - git remote add origin https://example.com/repo.git
  - git update-ref refs/remotes/origin/main HEAD
  - git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main
  - git checkout feature
  expected: '{GREEN}[feature]{} {YELLOW}↓16s{}'
  expected_large: '{GRAY}[feature]{} {YELLOW}↓16s{}'
- description: Feature branch ahead and diverged
  name: 'Feature branch: ahead of origin/feature, diverged from origin/master'
  group: upstream
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - git checkout -b main
  - echo "A" > file.txt
  - git add file.txt
  - git commit -m "Commit A"
  - echo "B" >> file.txt
  - git add file.txt
  - git commit -m "Commit B"
  - echo "C" >> file.txt
  - git add file.txt
  - git commit -m "Commit C"
  - echo "D" >> file.txt
  - git add file.txt
  - git commit -m "Commit D"
  - echo "E" >> file.txt
  - git add file.txt
  - git commit -m "Commit E"
  - echo "F" >> file.txt
  - git add file.txt
  - git commit -m "Commit F"
  - git remote add origin https://example.com/repo.git
  - git update-ref refs/remotes/origin/main HEAD
  - git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main
  - git checkout HEAD~3
  - git checkout -b feature
  - echo "X" >> feature.txt
  - git add feature.txt
  - git commit -m "Commit X"
  - echo "Y" >> feature.txt
  - git add feature.txt
  - git commit -m "Commit Y"
  - echo "W" >> feature.txt
  - git add feature.txt
  - git commit -m "Commit W"
  - git update-ref refs/remotes/origin/feature HEAD
  - git config branch.feature.remote origin
  - git config branch.feature.merge refs/heads/feature
  - echo "Z" >> feature.txt
  - git add feature.txt
  - git commit -m "Commit Z"
  expected: '{GREEN}[feature]{} {RED}↑4 ↓9s{}{BLUE}(↑1){}'
  expected_large: '{GRAY}[feature]{} {RED}↑4 ↓9s{}{BLUE}(↑1){}'
- description: Fork workflow - tracking fork remote but comparing to origin/main
  name: 'Fork workflow: branch tracks fork remote, compares to origin/main'
  group: upstream
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - git checkout -b main
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base commit"
  - git remote add origin https://example.com/upstream/repo.git
  - git update-ref refs/remotes/origin/main HEAD
  - git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main
  - git checkout -b feature
  - echo "feature work" > feature.txt
  - git add feature.txt
  - git commit -m "Feature commit"
  - git remote add fork https://example.com/user/repo.git
  - git update-ref refs/remotes/fork/feature HEAD
  - git config branch.feature.remote fork
  - git config branch.feature.merge refs/heads/feature
  expected: '{GREEN}[feature]{} {BLUE}↑1{}'
  expected_large: '{GRAY}[feature]{} {BLUE}↑1{}'
- description: Disjoint histories - origin points to unrelated repo
  name: Disjoint histories (no common ancestor)
  group: upstream
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "local" > file.txt
  - git add file.txt
  - git commit -m "Local commit"
  - git remote add origin https://example.com/repo.git
  - git checkout --orphan unrelated
  - git rm -f file.txt
  - echo "unrelated" > other.txt
  - git add other.txt
  - git commit -m "Unrelated commit"
  - git update-ref refs/remotes/origin/master HEAD
  - git checkout master
  expected: '{GREEN}[master]{} {RED}[no common ancestor with origin/master]{}'
  expected_large: '{GRAY}[master]{} {RED}[no common ancestor with origin/master]{}'
