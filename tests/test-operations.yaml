name: Git Operations In Progress
tests:
- description: Merge in progress without conflicts
  name: Merge in progress (no conflicts)
  group: in-progress
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "main" > file.txt
  - git add file.txt
  - git commit -m "Main commit"
  - git checkout -b feature
  - echo "feature" > feature.txt
  - git add feature.txt
  - git commit -m "Feature commit"
  - git checkout master
  - echo "master2" > master.txt
  - git add master.txt
  - git commit -m "Master commit 2"
  - git merge feature --no-commit
  expected: '{YELLOW}[master]{} {CYAN}[merge:commit]{}'
- description: Merge with conflicts
  name: Merge with conflicts
  group: in-progress
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > conflict.txt
  - git add conflict.txt
  - git commit -m "Base"
  - git checkout -b feature
  - echo "feature change" > conflict.txt
  - git add conflict.txt
  - git commit -m "Feature change"
  - git checkout master
  - echo "master change" > conflict.txt
  - git add conflict.txt
  - git commit -m "Master change"
  - git merge feature || true
  expected: '{RED}[master]{} {RED}[merge:conflict]{}'
- description: Rebase stopped for editing
  name: Rebase stopped for edit
  group: in-progress
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base"
  - echo "change1" > file.txt
  - git add file.txt
  - git commit -m "Change 1"
  - GIT_SEQUENCE_EDITOR="sed -i 's/^pick/edit/'" git rebase -i HEAD~1
  expected: '{YELLOW}[deab948]{} ⚡{CYAN}[rebase:continue 1/1]{}'
- description: Cherry-pick with conflict
  name: Cherry-pick with conflict
  group: in-progress
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base"
  - git checkout -b feature
  - echo "feature change" > file.txt
  - git add file.txt
  - git commit -m "Feature change"
  - git checkout master
  - echo "master change" > file.txt
  - git add file.txt
  - git commit -m "Master change"
  - git cherry-pick feature || true
  expected: '{RED}[master]{} {RED}[cherrypick:conflict]{}'
- description: Cherry-pick sequence with remaining commits
  name: Cherry-pick sequence (+5 more)
  group: in-progress
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "base"
  - git checkout -b source
  - command: echo "source$i" >> source.txt && git add source.txt && git commit -m
      "source$i"
    repeat: 8
  - git checkout master
  - echo "conflict" > source.txt
  - git add source.txt
  - git commit -m "conflict"
  - git cherry-pick source~5..source || true
  expected: '{RED}[master]{} {RED}[cherrypick:conflict +5]{}'
- description: Rebase with conflicts
  name: Rebase with conflicts
  group: in-progress
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base"
  - git checkout -b feature
  - echo "feature line 1" >> file.txt
  - git add file.txt
  - git commit -m "Feature commit 1"
  - echo "feature line 2" >> file.txt
  - git add file.txt
  - git commit -m "Feature commit 2"
  - git checkout master
  - echo "master line 1" >> file.txt
  - git add file.txt
  - git commit -m "Master commit"
  - git checkout feature
  - git rebase master || true
  expected: '{RED}[2fcfb6b]{} ⚡{RED}[rebase:conflict 1/2]{}'
- description: Multi-commit rebase with progress (conflict mid-way)
  name: Rebase progress with conflict
  group: in-progress
  example: true
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "base"
  - command: echo "master$i" >> master.txt && git add master.txt && git commit -m
      "master$i"
    repeat: 10
  - git checkout -b feature HEAD~10
  - command: echo "feature$i" >> file.txt && git commit -am "feature$i"
    repeat: 5
  - echo "conflict!" > master.txt
  - git add master.txt
  - git commit -m "conflict commit"
  - command: echo "feature$i" >> file.txt && git commit -am "feature$i"
    repeat: 5
  - git rebase master || true
  expected: '{RED}[e89a60e]{} ⚡{RED}[rebase:conflict 6/11]{}'
- description: Multi-commit rebase with progress (after resolving conflict)
  name: Rebase progress after resolving
  group: in-progress
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "base"
  - command: echo "master$i" >> master.txt && git add master.txt && git commit -m
      "master$i"
    repeat: 10
  - git checkout -b feature HEAD~10
  - command: echo "feature$i" >> file.txt && git commit -am "feature$i"
    repeat: 5
  - echo "conflict!" > master.txt
  - git add master.txt
  - git commit -m "conflict commit"
  - command: echo "feature$i" >> file.txt && git commit -am "feature$i"
    repeat: 5
  - git rebase master || true
  - echo "resolved" > master.txt
  - git add master.txt
  expected: '{YELLOW}[e89a60e]{} ⚡{CYAN}[rebase:continue 6/11]{}'
- description: Git revert with conflicts
  name: Revert with conflicts
  group: in-progress
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base"
  - echo "change to revert" > file.txt
  - git add file.txt
  - git commit -m "Change to revert"
  - echo "conflicting change" > file.txt
  - git add file.txt
  - git commit -m "Conflicting change"
  - git revert HEAD~1 || true
  expected: '{RED}[master]{} {RED}[revert:conflict]{}'
- description: Repository with worktree
  name: Worktree exists (main repo clean)
  group: worktree
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "main" > file.txt
  - git add file.txt
  - git commit -m "Main commit"
  - git checkout -b feature
  - echo "feature" > feature.txt
  - git add feature.txt
  - git commit -m "Feature commit"
  - git checkout master
  - git worktree add ../worktree-dir feature
  expected: '{GREEN}[master]{}'
  expected_large: '{GRAY}[master]{}'
- description: Running git-prompt inside a linked worktree
  name: Linked worktree (full checkout)
  group: worktree
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "main" > file.txt
  - git add file.txt
  - git commit -m "Main commit"
  - git checkout -b feature
  - echo "feature" > feature.txt
  - git add feature.txt
  - git commit -m "Feature commit"
  - git checkout master
  - git worktree add ../worktree-dir feature
  cwd: ../worktree-dir
  expected: '{GREEN}[feature]{} 🌳'
  expected_large: '{GRAY}[feature]{} 🌳'
- description: Running git-prompt inside a sparse worktree
  name: Sparse worktree
  group: worktree
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - mkdir src docs
  - echo "code" > src/main.c
  - echo "docs" > docs/readme.txt
  - git add src docs
  - git commit -m "Initial commit"
  - git checkout -b sparse-feature
  - git checkout master
  - git worktree add ../sparse-wt sparse-feature
  - cd ../sparse-wt && git sparse-checkout init --cone && git sparse-checkout set
    src
  cwd: ../sparse-wt
  expected: '{GREEN}[sparse-feature]{} 🪾'
  expected_large: '{GRAY}[sparse-feature]{} 🪾'
- description: Sparse worktree with sparse index (index.sparse=true) shows correct
    color for clean state. The sparse index has directory entries for paths outside
    the cone - these must not be misdetected as unstaged changes.
  name: Sparse index clean
  group: worktree
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - mkdir -p src/a src/b src/c docs/x docs/y
  - echo "a1" > src/a/f1.txt
  - echo "a2" > src/a/f2.txt
  - echo "b1" > src/b/f1.txt
  - echo "c1" > src/c/f1.txt
  - echo "d1" > docs/x/f1.txt
  - echo "d2" > docs/y/f1.txt
  - git add .
  - git commit -m "Initial commit with multiple dirs"
  - git checkout -b sparse-feature
  - git checkout master
  - git worktree add ../sparse-idx-wt sparse-feature
  - cd ../sparse-idx-wt && git sparse-checkout init --cone && git sparse-checkout
    set src/a && git config index.sparse true && git status > /dev/null
  cwd: ../sparse-idx-wt
  expected: '{GREEN}[sparse-feature]{} 🪾'
  expected_large: '{GRAY}[sparse-feature]{} 🪾'
- description: Sparse index shows RED for modified file in sparse cone.
  name: Sparse index modified file
  group: worktree
  steps:
  - cd ../sparse-idx-wt && echo "modified" > src/a/f1.txt
  cwd: ../sparse-idx-wt
  expected: '{RED}[sparse-feature]{} 🪾'
  expected_large: '{GRAY}[sparse-feature]{} 🪾'
- description: Sparse index shows YELLOW for staged changes.
  name: Sparse index staged file
  group: worktree
  steps:
  - cd ../sparse-idx-wt && git add src/a/f1.txt
  cwd: ../sparse-idx-wt
  expected: '{YELLOW}[sparse-feature]{} 🪾'
  expected_large: '{GRAY}[sparse-feature]{} 🪾'
- description: Sparse index shows GREEN after committing.
  name: Sparse index after commit
  group: worktree
  steps:
  - cd ../sparse-idx-wt && git commit -m "modify file in sparse cone"
  cwd: ../sparse-idx-wt
  expected: '{GREEN}[sparse-feature]{} 🪾'
  expected_large: '{GRAY}[sparse-feature]{} 🪾'
- description: Git am (apply mailbox) clean apply
  name: Git am clean apply
  group: am
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base"
  - git checkout -b patch-branch
  - echo "patch content" >> file.txt
  - git add file.txt
  - git commit -m "Patch commit"
  - git format-patch -1 HEAD --stdout > patch.diff
  - git checkout master
  - git am patch.diff
  - rm patch.diff
  expected: '{GREEN}[master]{}'
  expected_large: '{GRAY}[master]{}'
- description: Git am with conflict (uses rebase internally)
  name: Git am with conflicts
  group: am
  reset: true
  steps:
  - git init
  - git config user.name "Test"
  - git config user.email "test@example.com"
  - echo "base" > file.txt
  - git add file.txt
  - git commit -m "Base"
  - git checkout -b patch-branch
  - echo "patch content" > file.txt
  - git add file.txt
  - git commit -m "Patch commit"
  - git format-patch -1 HEAD --stdout > patch.diff
  - git checkout master
  - echo "conflicting content" > file.txt
  - git add file.txt
  - git commit -m "Conflicting commit"
  - git am patch.diff || true
  expected: '{YELLOW}[master]{} {CYAN}[rebase:continue 1/1]{}'
